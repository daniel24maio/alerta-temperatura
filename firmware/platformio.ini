[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Configuração de porta para macOS (detectada: /dev/cu.usbserial-5B520923941)
upload_port = /dev/cu.usbserial-5B520923941
monitor_port = /dev/cu.usbserial-5B520923941
; upload_port = COM5 ; (Para Windows)
; monitor_port = COM5

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    knolleary/PubSubClient @ ^2.8
    adafruit/DHT sensor library @ ^1.4.4
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    bodmer/TFT_eSPI @ ^2.5.31
    claws/BH1750 @ ^1.3.0

build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=76
    -DTFT_HEIGHT=284
    -DCGRAM_OFFSET=1
    -DTFT_INVERSION_ON=1
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BL=32
    -DTFT_BACKLIGHT_ON=LOW
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=27000000
